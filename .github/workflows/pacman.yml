name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone Pac-Man generator
        run: |
          git clone https://github.com/gregkozakiewicz/pacman-contribution-graph.git pacman-generator

      - name: Install dependencies
        working-directory: pacman-generator
        run: npm install

      - name: Generate Pac-Man
        working-directory: pacman-generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/generate.mjs --user shree895 --out dist

      - name: Publish Pac-Man to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: pacman-generator/dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
