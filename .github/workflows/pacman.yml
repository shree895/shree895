name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Pac-Man
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/pacman.svg?palette=github-dark
            output/pacman-dark.svg?palette=github-dark&color_snake=white&color_dots=#0D1B2A,#1B263B,#415A77,#778DA9,#E0E1DD
